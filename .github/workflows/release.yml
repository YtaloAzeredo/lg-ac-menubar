name: Publicar release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Testes
        shell: pwsh
        run: ./windows/scripts/test.ps1
      - name: Gerar executável x64
        shell: pwsh
        run: ./windows/build-app.ps1 -NoInstall -Runtime win-x64
      - name: Gerar executável arm64
        shell: pwsh
        run: ./windows/build-app.ps1 -NoInstall -Runtime win-arm64
      - name: Enviar os executáveis
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            windows/dist/LG-AC-windows-x64.exe
            windows/dist/LG-AC-windows-arm64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: linux/global.json
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring libfontconfig1
      - name: Testes
        env:
          LGAC_REQUIRE_DBUS: '1'
        run: |
          dbus-run-session -- bash -c 'echo -n teste-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && ./linux/scripts/test.sh'
      - name: Gerar executável x64
        run: ./linux/build-app.sh --no-install --runtime linux-x64
      - name: Gerar executável arm64
        run: ./linux/build-app.sh --no-install --runtime linux-arm64
      - name: Iniciar em cada distribuição
        run: ./linux/scripts/smoke-distros.sh linux/dist/LG-AC-linux-x64
      - name: Enviar os executáveis
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            linux/dist/LG-AC-linux-x64
            linux/dist/LG-AC-linux-arm64
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Baixar os executáveis
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag "${flags[@]}" \
            artifacts/windows/LG-AC-windows-x64.exe \
            artifacts/windows/LG-AC-windows-arm64.exe \
            artifacts/linux/LG-AC-linux-x64 \
            artifacts/linux/LG-AC-linux-arm64
