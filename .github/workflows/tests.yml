name: Testes

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Versão do Swift
        run: swift --version
      - name: Testes
        run: ./macos/scripts/test.sh
      - name: Empacotar o app (sem instalar)
        run: ./macos/build-app.sh --no-install

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Testes
        shell: pwsh
        run: ./windows/scripts/test.ps1
      - name: Gerar o executável (sem instalar)
        shell: pwsh
        run: ./windows/build-app.ps1 -NoInstall

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: linux/global.json
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring libfontconfig1
      - name: Testes
        env:
          LGAC_REQUIRE_DBUS: '1'
        run: |
          dbus-run-session -- bash -c 'echo -n teste-ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && ./linux/scripts/test.sh'
      - name: Gerar o executável (sem instalar)
        run: ./linux/build-app.sh --no-install
      - name: Iniciar em cada distribuição
        run: ./linux/scripts/smoke-distros.sh linux/dist/LG-AC-linux-x64
